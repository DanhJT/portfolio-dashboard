name: Refresh data snapshot

# Regenerates frontend/public/snapshot.json from live market data and commits
# it. The commit triggers Vercel's auto-deploy, so the static dashboard always
# serves fresh daily data without a live backend.
#
# Runs daily after the US market has closed and settled. Each run re-runs the
# monthly backtest of the current rules; holdings only change on the first US
# trading day of the month. Can also be triggered manually from the Actions tab.
#
# Needs the repository secret SEC_CONTACT_EMAIL: SEC EDGAR (book equity for the
# value signal) requires a contact email in every request.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (~after US EOD data settles)
  workflow_dispatch:

# Never let two refreshes run at once.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # SEC filings and share-count history barely change day to day; keep
      # them between runs so each refresh only fetches what is new.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Generate snapshot
        working-directory: backend
        # The generator exits non-zero on failure and leaves the existing
        # snapshot untouched, so a bad data day never publishes an empty file.
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python generate_snapshot.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- frontend/public/snapshot.json; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/snapshot.json
          git commit -m "chore: refresh data snapshot [skip ci]"
          git push
