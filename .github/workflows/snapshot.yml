name: Refresh data snapshot

# Regenerates frontend/public/snapshot.json from live market data and commits
# it. The commit triggers Vercel's auto-deploy, so the static dashboard always
# serves fresh daily data without a live backend.
#
# Runs daily after the US market has closed and settled. Holdings are only
# re-screened on the first US trading day of the month; other days hold the
# existing portfolio and refresh prices/risk. Can also be triggered manually
# from the Actions tab (workflow_dispatch), optionally forcing a fresh screen.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (~after US EOD data settles)
  workflow_dispatch:
    inputs:
      force_rebalance:
        description: "Re-screen the S&P 500 now instead of holding current positions"
        type: boolean
        default: false

# Never let two refreshes run at once.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate snapshot
        working-directory: backend
        # The generator exits non-zero on failure and leaves the existing
        # snapshot untouched, so a bad data day never publishes an empty file.
        # Scheduled runs have no inputs, so FORCE_REBALANCE stays empty there.
        env:
          FORCE_REBALANCE: ${{ inputs.force_rebalance && '1' || '' }}
        run: python generate_snapshot.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- frontend/public/snapshot.json; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/snapshot.json
          git commit -m "chore: refresh data snapshot [skip ci]"
          git push
